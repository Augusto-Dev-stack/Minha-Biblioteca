<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selecionar acesso | SESI Biblioteca</title>
  <link rel="icon" type="image/png" href="sesi.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <header>
    <div class="conteudo-cabecalho">
      <a class="marca" href="index.html">
        <img src="sesi.png" alt="Logo SESI" class="imagem-logo" />
        <span>SESI <span class="separador-marca">|</span> Biblioteca</span>
      </a>
    </div>
  </header>

  <main>
    <section class="pagina-acesso">
      <div class="cabecalho-acesso">
        <h1>Selecione o seu acesso</h1>
        <p>Escolha o tipo de conta para continuar.</p>
      </div>

      <div class="lista-acesso">
        <article class="cartao-acesso">
          <div>
            <h2>Professor / Admin</h2>
            <p>Área exclusiva para professores gerirem a biblioteca escolar.</p>
          </div>
          <div>
            <a class="botao-principal" href="login-professor.html">Login</a>
          </div>
        </article>

        <article class="cartao-acesso">
          <div>
            <h2>Aluno</h2>
            <p>Área exclusiva para alunos consultarem e alugarem livros.</p>
          </div>
          <div>
            <a class="botao-principal" href="login.html">Login</a>
            <p class="texto-auxiliar" style="margin-top: 10px;"><a href="cadastro-aluno.html">Não tem conta?
                Cadastre-se</a></p>
          </div>
        </article>
      </div>
    </section>
  </main>

  <script src="script.js" defer></script>
</body>

</html>
